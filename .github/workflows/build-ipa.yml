name: Build iOS App (IPA)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p

      - name: Build for iOS (device arm64, unsigned)
        run: |
          # `-exportArchive` is not used here: it needs a signing identity, which CI does not
          # have. The .app is zipped into an unsigned IPA below instead. A locally signed
          # archive can be exported with the checked-in ExportOptions.plist.
          xcodebuild \
            -scheme Ghosted \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        # -exportArchive cannot run without a signing identity, so the .app is
        # zipped into an unsigned IPA by hand. It must be re-signed (free Personal
        # Team or a paid team) before it can be installed on a device.
        run: |
          APP="build/Build/Products/Release-iphoneos/Ghosted.app"
          test -d "$APP" || { echo "::error::Built app not found at $APP"; exit 1; }
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          ( cd build/ipa && zip -qry "$GITHUB_WORKSPACE/Ghosted-unsigned.ipa" Payload )
          ls -lh Ghosted-unsigned.ipa
          echo "Unsigned IPA built. Re-sign it with a development team to install on a device."

      - name: Verify IPA
        run: |
          unzip -l Ghosted-unsigned.ipa | head -20
          unzip -l Ghosted-unsigned.ipa | grep -q 'Payload/Ghosted.app/Ghosted' \
            || { echo "::error::Ghosted binary missing from IPA"; exit 1; }
          echo "IPA contents verified."

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghosted-IPA
          path: Ghosted-unsigned.ipa
          retention-days: 30
        if: success()

      - name: Generate build summary
        if: always()
        run: |
          echo "## iOS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Scheme**: Ghosted" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration**: Release" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture**: arm64 (generic/platform=iOS)" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing**: disabled in CI (no Apple Developer account)" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: Ghosted-unsigned.ipa (must be re-signed to install)" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Ghosted-IPA
          path: .

      - name: Get version from tag or commit
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="v$(date +%Y.%m.%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./Ghosted-unsigned.ipa
          tag_name: ${{ steps.version.outputs.version }}
          name: Ghosted ${{ steps.version.outputs.version }}
          body: |
            ## Ghosted iOS Build

            **Version**: ${{ steps.version.outputs.version }}
            **Build Date**: ${{ github.event.head_commit.timestamp || 'N/A' }}
            **Commit**: ${{ github.sha }}

            ### Contents
            - `Ghosted-unsigned.ipa` — compiled arm64 app bundle, **unsigned**

            ### Important: this IPA is not installable as-is
            CI has no Apple Developer account, so the binary is not signed and there
            is no provisioning profile. To install it you must sign it with your
            own team.

            **Option A — build locally (recommended)**
            1. Open `Ghosted.xcodeproj` in Xcode.
            2. Xcode → Settings → Accounts → `+` → sign in with your Apple ID.
            3. Select the `Ghosted` target → Signing & Capabilities →
               tick **Automatically manage signing** → choose your **Personal Team**.
            4. Change the bundle identifier to something unique, e.g. `com.yourname.ghosted`.
            5. Enable Developer Mode on the iPhone:
               Settings → Privacy & Security → Developer Mode → On (reboot when prompted).
            6. Connect and trust the iPhone, pick it in the deployment menu, press Run.
            7. If the app will not open ("Untrusted Developer"):
               Settings → General → VPN & Device Management → your Apple ID → Trust.

            Free Personal Team provisioning expires after 7 days and is limited to
            3 devices / 10 app IDs. Re-run steps 3-6 after expiry.

            **Option B — re-sign the downloaded IPA**
            Use a tool such as `ios-app-installer`, or run Xcode's
            `Product → Archive` flow locally against this source.

            ### Legal Notice
            Please review the LICENSE and README for important disclaimers and usage restrictions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
